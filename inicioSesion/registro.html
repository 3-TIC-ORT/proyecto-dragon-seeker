<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="styleregistro.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/JZylber/SoqueTIC-Client@v1.4.2/soquetic-client.js"></script>
</head>
<body>
  <div class="form-container">
    <h2>Registrate</h2>
    <form id="formRegistro">
        
      <label for="nombre">Nombre</label>
      <input type="nombre" id="nombre" name="nombre" required>
      
      <label for="correo">Correo electrónico</label>
      <input type="usuario" id="usuario2" name="usuario" required>

      <label for="contrasena">Contraseña</label>
      <input type="password" id="contraseña2" name="contraseña" required>

      <button id="botonIngresar2" type="submit">Ingresar</button>
    </form>

    <p id="mensaje2"></p>
    <p>¿Ya tenés cuenta? <a href="inicioSesion.html">Iniciá Sesion</a></p>
  </div>

  <script src="registro.js"></script>
</body>
</html>
