<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopción</title>
    <link rel="stylesheet" href="../estilos/comun.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/JZylber/SoqueTIC-Client@v1.4.2/soquetic-client.js"></script>
    <script>
        connect2Server();
    </script>
</head>
<body>
<section class="dragon">
    <div class="hud">
        <h2 class="nombre" id="nombreDragon">Dragon</h2>
        <div class="vidaBarra">
            <span class="vidaTexto">HP</span>
            <div class="vidaRelleno"></div>
        </div>
    </div>
    <img class="sprite" src="https://www.pngplay.com/wp-content/uploads/10/Charmander-Pokemon-PNG-Free-File-Download.png" alt="">
</section>

<footer class="footer">
    <p class="instruccionAdopcion">Repetí la secuencia para adoptar al dragón</p>
    <section class="menudeataques" id="menudeataques">
        <div class="btn">1</div>
        <div class="btn">2</div>
        <div class="btn">3</div>
        <div class="btn">4</div>
        <div class="btn">5</div>
        <div class="btn">6</div>
        <div class="btn">7</div>
        <div class="btn">8</div>
    </section>
</footer>
<!-- Overlay de fracaso: define window.mostrarOverlayFracaso antes de adopcion.js -->
<script src="../logros/overlay.js"></script>
<script src="adopcion.js"></script>
</body>
</html>
