<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enfrentamiento</title>
  <link rel="stylesheet" href="../estilos/comun.css">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="enfrentamiento">
  <main class="arena">
    <section class="lado lado-usuario">
      <img class="sprite" id="spriteUsuario" alt="">
      <h2 class="nombre" id="nombreUsuario"></h2>
      <p class="datos" id="datosUsuario"></p>
    </section>

    <div class="vs">VS</div>

    <section class="lado lado-rival">
      <img class="sprite" id="spriteRival" alt="">
      <h2 class="nombre" id="nombreRival"></h2>
      <p class="datos" id="datosRival"></p>
    </section>
  </main>

  <div class="boton-pelear-wrap">
    <button type="button" class="boton-pelear" id="botonPelear">¡PELEAR!</button>
  </div>

  <script src="enfrentamiento.js"></script>
</body>
</html>
