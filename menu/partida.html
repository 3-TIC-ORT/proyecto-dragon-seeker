<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partida</title>
  <link rel="stylesheet" href="../estilos/comun.css">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/JZylber/SoqueTIC-Client@v1.4.2/soquetic-client.js"></script>
</head>
<body class="pantalla fondo-mundo">
  <header class="barra-iconos">
    <button type="button" aria-label="Configuración">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M19.14 12.94a7.49 7.49 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.68 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.49 7.49 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64z"></path></svg>
    </button>
    <button type="button" aria-label="Menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
    </button>
    <button type="button" aria-label="Salir" id="iconoSalir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"></path><polyline points="9 8 13 12 9 16"></polyline><line x1="13" y1="12" x2="3" y2="12"></line></svg>
    </button>
  </header>

  <nav class="menu-opciones">
    <button type="button" class="boton-madera" id="btnCargar">CARGAR PARTIDA</button>
    <!-- Lista desplegable de partidas guardadas (la llena partida.js) -->
    <div class="desplegable" id="listaPartidas" hidden></div>

    <button type="button" class="boton-madera" id="btnNueva">NUEVA PARTIDA</button>
    <!-- Form para crear una partida nueva (oculto hasta tocar NUEVA PARTIDA) -->
    <div class="crear-partida" id="formNueva" hidden>
      <input type="text" id="nombrePartida" class="input-partida" maxlength="30"
             placeholder="NOMBRE DE LA PARTIDA">
      <button type="button" class="boton-madera" id="btnCrear">CREAR</button>
    </div>
  </nav>

  <script src="partida.js"></script>
</body>
</html>
